name: Contrôles

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    name: Lint, types, build, accessibilité
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Build (export statique)
        run: npm run build

      # Chrome est préinstallé sur les machines GitHub : aucun téléchargement de navigateur.
      - name: Accessibilité et confidentialité (axe-core)
        run: npm run test:a11y

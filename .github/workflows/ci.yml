name: Contrôles

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    name: Lint, types, build, accessibilité
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Build (export statique)
        run: npm run build

      # Chrome est préinstallé sur les machines GitHub : aucun téléchargement de navigateur.
      - name: Accessibilité et confidentialité (axe-core)
        run: npm run test:a11y

      - name: Tests unitaires (accès Cloudflare Access, import, scores)
        run: npm run test:unit

      # Worker local (D1 locale) avec une fausse IA : parcours complet de l'outil d'administration.
      - name: Outil d'administration (parcours complet et axe-core)
        run: |
          printf 'ALLOW_LOCAL_DEV=1\nLLM_PROVIDER=openai\nLLM_API_KEY=test\nLLM_MODEL=mock\nLLM_BASE_URL=http://127.0.0.1:8799/v1\n' > .dev.vars
          npx wrangler d1 migrations apply DB --local
          node scripts/mock-llm.mjs &
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/status > /dev/null && break; sleep 2; done
          node scripts/admin-check.mjs || { cat wrangler.log; exit 1; }
